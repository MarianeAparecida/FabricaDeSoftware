appId: com.anonymous.AgendaSUS
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "http://.*:80.*"
    timeout: 60000
- tapOn: "http://.*:80.*"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 20000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- back:
    optional: true
- extendedWaitUntil:
    visible: "CPF"
    timeout: 30000
- tapOn: "CPF"
- inputText: "123.456.789-00"
- tapOn:
    text: "Senha"
    index: 1
- inputText: "ABC123!@#ab"
- tapOn: "Acessar"
- assertVisible: "Olá, Usuário!"